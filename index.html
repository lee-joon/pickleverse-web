    <style>
  :root {
    --brand:#00361A; --brand-soft:#CFEAD6; --accent:#FBE366; --accent-soft:#FDF4C4; --on-accent:#736400;
    --bg:#F8F9FA; --surface:#FFFFFF; --ink:#1F2421; --sub:#5C6360; --line:#C1C9BF; --line-soft:#E2E6E2;
    --row-hover:#F1F5F2; --head:#EEF3EF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand:#5E9278; --brand-soft:#0F2416; --accent:#BCA45C; --accent-soft:#2E2A18; --on-accent:#F1E4B3;
      --bg:#101418; --surface:#171D22; --ink:#F5F7FA; --sub:#C8D0D8; --line:#303A45; --line-soft:#232B33;
      --row-hover:#1D242B; --head:#1B2228;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.55 "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
         font-variant-numeric:tabular-nums; }
  a { color:inherit; text-decoration:none; }
  a:hover { text-decoration:underline; }
  a:focus-visible, .btn:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  .wrap { max-width:1040px; margin:0 auto; padding:0 12px; }

  /* ── 마스트헤드 (피클허브 브랜드) — 기억에 남는 요소는 오른쪽의 피클볼 구멍 패턴 하나 ── */
  .top { background:#00361A; color:#fff; position:relative; overflow:hidden; }
  .top .wrap { height:56px; display:flex; align-items:center; gap:10px; position:relative; }
  .top img { width:28px; height:28px; border-radius:7px; display:block; }
  .top .brand { font-weight:700; font-size:18px; letter-spacing:-0.3px; }
  .top .brand small { font-weight:400; opacity:.72; margin-left:7px; font-size:12px; letter-spacing:0; }
  .top .ball { position:absolute; right:-24px; top:-70px; width:200px; height:200px; pointer-events:none; }
  .top .wrap > * { position:relative; z-index:1; }
  .top .cta { margin-left:auto; border:1px solid rgba(255,255,255,.55); color:#fff; font-weight:700; font-size:12px;
              padding:8px 12px; border-radius:6px; white-space:nowrap; min-height:36px; display:inline-flex; align-items:center; }
  .top .cta:hover { text-decoration:none; background:rgba(255,255,255,.1); }

  /* ── 게시판 헤더 + 탭 — 밑줄 하나로 잇는다(폴더 탭·액센트 바 없음) ── */
  .gall { background:var(--surface); border-bottom:1px solid var(--line); }
  .gall .wrap { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-top:16px; }
  .gall h1 { margin:0 0 12px; font-size:21px; font-weight:700; letter-spacing:-0.4px; line-height:1.2; }
  .tabs { display:flex; gap:4px; }
  .tabs a { display:block; padding:8px 12px 10px; font-weight:500; font-size:13px; color:var(--sub); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs a.on { color:var(--brand); font-weight:700; border-bottom-color:var(--brand); }
  .tabs a:hover { text-decoration:none; color:var(--ink); }

  /* ── 목록 툴바 ── */
  .toolbar { display:flex; align-items:center; justify-content:space-between; padding:10px 0 6px; font-size:12px; color:var(--sub); }
  .toolbar b { color:var(--ink); }
  .toolbar .stat + .stat { margin-left:12px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:6px 12px; border-radius:6px; font-size:13px; font-weight:700; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn:hover { text-decoration:none; filter:brightness(.97); }

  /* ── 게시판 표 (디시 gall_list 밀도) ── */
  table.list { width:100%; table-layout:fixed; border-collapse:collapse; border-top:2px solid var(--brand); border-bottom:1px solid var(--line); background:var(--surface); }
  table.list th { background:var(--head); color:var(--sub); font-weight:700; font-size:12px; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.list td { padding:7px 6px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  table.list tr:hover td { background:var(--row-hover); }
  table.list .num, table.list .date, table.list .cnt { font-variant-numeric:tabular-nums; }
  table.list .num { width:60px; text-align:center; color:var(--sub); font-size:12px; }
  table.list .tit { text-align:left; }
  table.list .tit { overflow:hidden; }
  table.list .tit a { display:inline-block; max-width:calc(100% - 34px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  table.list .tit .cmt { color:var(--brand); font-weight:700; font-size:12px; margin-left:4px; }
  table.list .who { width:96px; text-align:center; color:var(--sub); font-size:12px; white-space:nowrap; }
  table.list .date { width:74px; text-align:center; color:var(--sub); font-size:12px; white-space:nowrap; }
  table.list .cnt { width:52px; text-align:center; color:var(--sub); font-size:12px; }
  table.list tr.notice td { background:var(--accent-soft); }
  table.list tr.notice .num { color:var(--on-accent); font-weight:800; }
  table.list tr.notice .tit a { font-weight:700; }
  table.list tr.empty td { text-align:center; padding:44px 6px 40px; color:var(--sub); line-height:1.7; }
  table.list tr.empty .btn { margin-top:10px; }

  /* ── 페이지 번호 ── */
  .paging { display:flex; justify-content:center; gap:4px; padding:16px 0 8px; font-size:12px; }
  .paging a, .paging span { min-width:28px; height:28px; line-height:26px; text-align:center; padding:0 6px; border:1px solid var(--line-soft); border-radius:4px; color:var(--sub); background:var(--surface); }
  .paging .cur { border-color:var(--brand); color:var(--brand); font-weight:800; }
  .paging a:hover { text-decoration:none; border-color:var(--line); color:var(--ink); }

  /* ── 글 보기 ── */
  .view { background:var(--surface); border-top:2px solid var(--brand); border-bottom:1px solid var(--line); margin-top:10px; }
  .view .head { padding:14px 14px 10px; border-bottom:1px solid var(--line-soft); }
  .view .head .badge { display:inline-block; font-size:11px; font-weight:800; color:var(--on-accent); background:var(--accent-soft); padding:2px 7px; border-radius:3px; margin-right:6px; vertical-align:2px; }
  .view h2 { margin:0 0 6px; font-size:19px; font-weight:700; line-height:1.4; letter-spacing:-0.2px; text-wrap:balance; }
  .view .meta { display:flex; flex-wrap:wrap; gap:0 12px; color:var(--sub); font-size:12px; }
  .view .meta b { color:var(--ink); font-weight:600; }
  .view .body { padding:18px 14px 22px; font-size:15px; line-height:1.8; }
  .view .body p { margin:0 0 14px; }
  .view .link { padding:0 14px 16px; font-size:13px; }
  .view .link a { color:var(--brand); font-weight:700; }
  .view .foot { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-top:1px solid var(--line-soft); }

  /* ── 댓글 (디시 comment_box 밀도) — 웹은 읽기 전용 ── */
  .cmts { margin-top:10px; background:var(--surface); border:1px solid var(--line); }
  .cmts .h { padding:10px 14px; border-bottom:1px solid var(--line-soft); font-weight:700; font-size:13px; }
  .cmts .h b { color:var(--brand); }
  .cmts ul { list-style:none; margin:0; padding:0; }
  .cmts li { display:grid; grid-template-columns:92px 1fr auto; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line-soft); align-items:baseline; }
  .cmts li:last-child { border-bottom:none; }
  .cmts .who { font-weight:700; font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmts .who.op { color:var(--brand); }
  .cmts .opb { display:inline-block; margin-left:4px; padding:0 5px; font-size:10px; font-weight:700; line-height:16px; color:var(--brand); border:1px solid var(--brand); border-radius:3px; vertical-align:1px; }
  .cmts .who.gone { color:var(--sub); font-weight:500; }
  .cmts .txt { font-size:13px; line-height:1.6; overflow-wrap:anywhere; }
  .cmts .txt.tomb { color:var(--sub); font-style:italic; }
  .cmts .when { font-size:11px; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cmts .lock { padding:16px 14px; text-align:center; color:var(--sub); font-size:12px; border-top:1px solid var(--line-soft); }
  .cmts .lock a { display:inline-block; margin-left:8px; }

  /* ── 하단 앱 배너 + 푸터 ── */
  .promo { margin-top:16px; background:var(--brand-soft); border:1px solid var(--line-soft); border-radius:8px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .promo b { color:var(--brand); font-size:14px; font-weight:700; }
  .promo p { margin:2px 0 0; color:var(--sub); font-size:12px; }
  .promo .stores { display:flex; gap:6px; }
  footer { margin-top:28px; padding:18px 0 40px; border-top:1px solid var(--line); color:var(--sub); font-size:12px; }
  footer .wrap { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  footer a { color:var(--sub); }

  /* ── 상호작용 레이어(app.js) ── */
  .top .acct { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:12px; }
  .top .acct + .cta { margin-left:0; }
  .top .acct .me { opacity:.85; }
  .lnk { background:none; border:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .top .lnk { color:#fff; opacity:.9; text-decoration:none; font-weight:700; }
  dialog.pv { border:1px solid var(--line); border-radius:10px; padding:20px 20px 18px; width:min(420px, calc(100vw - 32px)); background:var(--surface); color:var(--ink); }
  dialog.pv::backdrop { background:rgba(0,0,0,.45); }
  dialog.pv h3 { margin:0 0 6px; font-size:16px; }
  dialog.pv .x { position:absolute; top:8px; right:10px; background:none; border:none; font-size:20px; color:var(--sub); cursor:pointer; }
  .pv-tabs { display:flex; gap:2px; margin-bottom:12px; border-bottom:1px solid var(--line); }
  .pv-tabs button { flex:1; background:none; border:none; border-bottom:2px solid transparent; padding:8px; font:inherit; font-weight:700; color:var(--sub); cursor:pointer; }
  .pv-tabs button.on { color:var(--brand); border-bottom-color:var(--brand); }
  .pv-social { display:grid; gap:6px; }
  .pv-social button { padding:9px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font:inherit; font-weight:700; cursor:pointer; }
  .pv-or { text-align:center; color:var(--sub); font-size:11px; margin:10px 0 6px; }
  .pv-form { display:grid; gap:10px; }
  .pv-form label { display:grid; gap:4px; font-size:12px; color:var(--sub); font-weight:700; }
  .pv-form input[type=text], .pv-form input[type=email], .pv-form input[type=password], .pv-form textarea { font:inherit; font-size:16px; padding:10px 12px; min-height:44px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  body:has(dialog.pv[open]) { overflow:hidden; }
  dialog.pv { max-height:calc(100dvh - 32px); overflow:auto; }
  .pv-form textarea { resize:vertical; line-height:1.6; }
  .pv-form .btn { font-size:14px; min-height:44px; }
  .pv-social button { min-height:44px; }
  .pv-tabs button { min-height:44px; }
  .pv-form .btn:disabled { opacity:.6; cursor:default; }
  .pv-radio { border:none; padding:0; margin:0; display:flex; gap:14px; font-size:13px; color:var(--ink); }
  .pv-radio legend { font-size:12px; color:var(--sub); font-weight:700; margin-bottom:4px; }
  .pv-radio label { display:flex; align-items:center; gap:4px; font-weight:500; color:var(--ink); }
  .pv-check { display:flex !important; align-items:center; gap:6px; font-weight:500 !important; color:var(--ink) !important; }
  .pv-check a { color:var(--brand); text-decoration:underline; }
  .pv-err { margin:0; color:#B4372E; font-size:12px; }
  .pv-note { margin:0 0 10px; color:var(--sub); font-size:12px; line-height:1.55; }
  .pv-cform { padding:12px 14px; border-top:1px solid var(--line-soft); }
  .pv-cform .pv-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .pv-del { color:#B4372E; margin-left:8px; font-size:11px; }
  .cmts .when .pv-del { text-decoration:none; }
  table.list tr.fresh td { background:var(--accent-soft); }
  .mine { display:inline-block; margin-left:6px; padding:0 6px; font-size:11px; font-weight:700; line-height:18px; color:var(--brand); border:1px solid var(--brand); border-radius:3px; vertical-align:1px; }
  .cmts .who .mine { margin-left:4px; }
  #pv-article:empty { min-height:120px; }

  @media (max-width:640px) {
    body { font-size:14px; }
    .top .brand small { display:none; }

    .toolbar { padding:10px 2px 6px; }
    .btn { min-height:44px; padding:8px 14px; }
    /* 표를 목록으로: 제목 한 줄(최대 2줄) + 메타 줄(글쓴이 · 작성일 · 댓글). 헤더 행은 숨긴다. */
    table.list { display:block; border-top:2px solid var(--brand); }
    table.list thead { display:none; }
    table.list tbody { display:block; }
    table.list tr { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; padding:12px 12px 11px; border-bottom:1px solid var(--line-soft); }
    table.list td { display:block; padding:0; border:0; width:auto; }
    table.list .num { display:none; }
    table.list .tit { flex:1 0 100%; order:-1; overflow:visible; }
    table.list .tit a { display:inline; max-width:none; white-space:normal; overflow:visible; font-size:15px; font-weight:500; line-height:1.45; }
    table.list .tit .cmt { font-size:13px; }
    table.list .who, table.list .date, table.list .cnt { font-size:12px; color:var(--sub); text-align:left; width:auto; }
    table.list .cnt::before { content:"댓글 "; }
    table.list .cnt { margin-left:auto; }
    table.list tr.notice { background:var(--accent-soft); }
    table.list tr.notice td { background:transparent; }
    table.list tr.notice .tit a::before { content:"공지"; display:inline-block; font-size:11px; font-weight:700; color:var(--on-accent); background:var(--accent-soft); border:1px solid var(--accent); padding:0 6px; border-radius:3px; margin-right:6px; vertical-align:1px; }
    table.list tr.fresh { background:var(--accent-soft); }
    table.list tr.fresh td { background:transparent; }
    table.list tr:hover td { background:transparent; }
    table.list tr.empty { display:block; text-align:center; padding:40px 12px; }
    table.list tr.empty td { width:100%; }
    .view .body { font-size:15px; }
    .view h2 { font-size:18px; }
    .cmts li { grid-template-columns:1fr auto; }
    .cmts .txt { grid-column:1 / -1; font-size:14px; }
    .paging a, .paging span { min-width:40px; height:40px; line-height:38px; }
  }
</style>
