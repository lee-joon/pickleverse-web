<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00361A" />
    <title>글쓰기 — 자유게시판 — 피클허브 커뮤니티</title>
    <meta name="description" content="피클볼 이야기를 익명으로 나누는 곳입니다. 로그인하면 웹에서도 바로 쓸 수 있습니다." />
    <link rel="canonical" href="https://picklehubkorea.com/free/" />
    <link rel="icon" href="https://picklehubkorea.com/assets/logo-128.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="피클허브 커뮤니티" />
    <meta property="og:title" content="글쓰기 — 자유게시판 — 피클허브 커뮤니티" />
    <meta property="og:description" content="피클볼 이야기를 익명으로 나누는 곳입니다. 로그인하면 웹에서도 바로 쓸 수 있습니다." />
    <meta property="og:url" content="https://picklehubkorea.com/free/" />
    <meta property="og:image" content="https://picklehubkorea.com/assets/logo-256.png" />
    <meta name="robots" content="noindex" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" />
    <style>
  :root {
    --brand:#00361A; --brand-soft:#CFEAD6; --accent:#FBE366; --accent-soft:#FDF4C4; --on-accent:#736400;
    --bg:#F8F9FA; --surface:#FFFFFF; --ink:#1F2421; --sub:#5C6360; --line:#C1C9BF; --line-soft:#E2E6E2;
    --row-hover:#F1F5F2; --head:#EEF3EF;
    /* 컨트롤 테두리는 표 헤어라인과 용도가 다르다 — 3:1 을 넘겨야 입력창·2차 버튼의 경계가 보인다. */
    --line-strong:#8B968D; --on-brand:#FFFFFF; --danger:#B4372E;
    /* 4px 간격 스케일. 밀도는 표 '안'에서 지키고 여백은 표 '바깥'에서 낸다. */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
    /* 읽기 열 — 본문·댓글·편집기가 공유한다(한글 약 42자). */
    --read:660px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand:#5E9278; --brand-soft:#0F2416; --accent:#BCA45C; --accent-soft:#2E2A18; --on-accent:#F1E4B3;
      --bg:#101418; --surface:#171D22; --ink:#F5F7FA; --sub:#C8D0D8; --line:#303A45; --line-soft:#232B33;
      --row-hover:#1D242B; --head:#1B2228;
      --line-strong:#5C6B79; --on-brand:#171D22; --danger:#FF6B5F;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; } /* display:flex/grid 를 준 요소도 hidden 속성이 이기게 */
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.65 "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
         font-variant-numeric:tabular-nums;
         /* 빈 게시판에서 푸터가 화면 중간에 뜨지 않게 */
         min-height:100dvh; display:flex; flex-direction:column; }
  main.wrap { flex:1 0 auto; padding-top:var(--s6); }
  a { color:inherit; text-decoration:none; }
  a:hover { text-decoration:underline; }
  a:focus-visible, .btn:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  .wrap { max-width:1040px; margin:0 auto; padding:0 var(--s4); }
  @media (min-width:1080px) { .wrap { padding:0 var(--s6); } }

  /* ── 마스트헤드 (피클허브 브랜드) — 기억에 남는 요소는 오른쪽의 피클볼 구멍 패턴 하나 ── */
  .top { background:#00361A; color:#fff; position:relative; overflow:hidden; }
  .top .wrap { height:56px; display:flex; align-items:center; gap:10px; position:relative; }
  .top img { width:28px; height:28px; border-radius:7px; display:block; }
  .top .brand { font-weight:700; font-size:18px; letter-spacing:-0.3px; }
  .top .brand small { font-weight:400; opacity:.72; margin-left:7px; font-size:12px; letter-spacing:0; }
  .top .ball { position:absolute; right:-24px; top:-70px; width:200px; height:200px; pointer-events:none; }
  .top .wrap > * { position:relative; z-index:1; }
  .top .cta { margin-left:auto; border:1px solid rgba(255,255,255,.55); color:#fff; font-weight:700; font-size:12px;
              padding:8px 12px; border-radius:6px; white-space:nowrap; min-height:36px; display:inline-flex; align-items:center; }
  .top .cta:hover { text-decoration:none; background:rgba(255,255,255,.1); }
  @media (max-width:640px) { .top .cta { min-height:44px; } }

  /* ── 게시판 헤더 + 탭 — 밑줄 하나로 잇는다(폴더 탭·액센트 바 없음) ── */
  .gall { background:var(--surface); border-bottom:1px solid var(--line); }
  .gall .wrap { display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s3); padding-top:var(--s4); }
  .gall h1 { margin:0 0 var(--s1); font-size:21px; font-weight:700; letter-spacing:-0.3px; line-height:1.25; }
  /* ch 은 '0' 폭 기준이라 한글에서는 절반만 담긴다 — px 로 고정한다. */
  .gall .lede { margin:0 0 var(--s3); font-size:13px; line-height:1.55; color:var(--sub); max-width:640px; }
  .gall .name { flex:1 1 auto; min-width:0; }
  .tabs { display:flex; gap:var(--s1); flex:none; }
  .tabs a { display:block; padding:8px 12px 10px; font-weight:500; font-size:13px; color:var(--sub); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs a.on { color:var(--brand); font-weight:700; border-bottom-color:var(--brand); }
  .tabs a:hover { text-decoration:none; color:var(--ink); }

  /* ── 목록 툴바 ── */
  /* 카운트가 숨겨져도(글 0건) 글쓰기 버튼은 오른쪽에 남는다. */
  .toolbar { display:flex; align-items:center; gap:var(--s3); padding:0 0 var(--s2); font-size:12px; color:var(--sub); }
  .toolbar .btn { margin-left:auto; }
  .toolbar b { color:var(--ink); font-weight:500; }
  /* 버튼 4종으로 수렴 — 1차(primary) / 2차(기본) / 파괴적(danger) / 텍스트(lnk) */
  .btn, .pv-social button { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:6px 12px; border-radius:6px; font-size:13px; font-weight:700; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer; font-family:inherit; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .btn.danger { color:var(--danger); border-color:var(--danger); background:var(--surface); }
  .btn:hover, .pv-social button:hover { text-decoration:none; filter:brightness(.97); }

  /* ── 게시판 표 (디시 gall_list 밀도) ── */
  table.list { width:100%; table-layout:fixed; border-collapse:collapse; border-top:2px solid var(--brand); border-bottom:1px solid var(--line); background:var(--surface); }
  table.list th { background:var(--head); color:var(--sub); font-weight:500; font-size:12px; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.list td { padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.list tr:hover td { background:var(--row-hover); }
  table.list .num, table.list .date, table.list .views { font-variant-numeric:tabular-nums; }
  /* 제목은 14px/500, 메타는 12px/400 — 크기·굵기·색 3축으로 스캔 위계를 만든다(행 높이는 그대로). */
  table.list .num { width:56px; text-align:center; color:var(--sub); font-size:12px; }
  table.list .tit { text-align:left; overflow:hidden; }
  table.list .tit a { display:inline-block; max-width:calc(100% - 44px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; font-size:14px; font-weight:500; }
  table.list .tit .cmt { color:var(--brand); font-weight:700; font-size:12px; margin-left:5px; }
  table.list .who { width:96px; text-align:center; color:var(--sub); font-size:12px; font-weight:400; white-space:nowrap; }
  table.list .date { width:74px; text-align:center; color:var(--sub); font-size:12px; font-weight:400; white-space:nowrap; }
  table.list .views { width:52px; text-align:center; color:var(--sub); font-size:12px; font-weight:400; white-space:nowrap; }
  table.list tr.notice td { background:var(--accent-soft); }
  table.list tr.notice .num { color:var(--on-accent); font-weight:700; }
  table.list tr.notice .tit a { font-weight:700; }
  table.list tr.empty td { text-align:center; padding:72px 6px 64px; color:var(--sub); line-height:1.7; }
  table.list tr.empty strong { display:block; font-size:16px; font-weight:700; color:var(--ink); margin-bottom:var(--s2); }
  table.list tr.empty .btn { margin-top:var(--s4); }

  /* ── 페이지 번호 ── */
  .paging { display:flex; justify-content:center; gap:var(--s1); padding:var(--s6) 0 var(--s2); font-size:12px; }
  .paging a, .paging span { min-width:36px; height:36px; line-height:34px; text-align:center; padding:0 var(--s2); border:1px solid var(--line-soft); border-radius:6px; color:var(--sub); background:var(--surface); }
  .paging .cur { border-color:var(--brand); color:var(--brand); font-weight:700; }
  @media (max-width:640px) { .paging a, .paging span { min-width:44px; height:44px; line-height:42px; } }
  .paging a:hover { text-decoration:none; border-color:var(--line); color:var(--ink); }

  /* ── 글 보기 — 읽기 열(--read)로 좁힌 밴드. 표는 1040px 를 그대로 쓰므로 게시판 밀도는 그대로다. ── */
  .view { border-top:2px solid var(--brand); border-bottom:1px solid var(--line); max-width:var(--read); margin:0 auto; }
  .view .head { padding:var(--s6) var(--s4) var(--s3); border-bottom:1px solid var(--line-soft); }
  .view .head .badge { display:inline-block; font-size:11px; font-weight:700; color:var(--on-accent); background:var(--accent-soft); padding:2px 7px; border-radius:4px; margin-right:6px; vertical-align:2px; }
  .view h2 { margin:0 0 var(--s2); font-size:26px; font-weight:700; line-height:1.38; letter-spacing:-0.3px; text-wrap:balance; }
  .view .meta { display:flex; flex-wrap:wrap; gap:var(--s1) var(--s3); color:var(--sub); font-size:12px; }
  .view .meta b { color:var(--ink); font-weight:500; }
  .view .body { padding:var(--s6) var(--s4) var(--s8); font-size:16px; line-height:1.85; }
  .view .body p { margin:0 0 var(--s4); }
  .view .link { padding:0 var(--s4) var(--s4); font-size:13px; }
  .view .link a { color:var(--brand); font-weight:700; }
  .view .foot { display:flex; justify-content:space-between; align-items:center; gap:var(--s3); padding:var(--s3) var(--s4); border-top:1px solid var(--line-soft); }
  .view .foot:empty { display:none; }
  /* 글 작업 버튼(수정·삭제·상단 고정)은 한 span 안에 들어간다 — 그 안에도 같은 간격을 준다.
     안 그러면 바깥 gap 만 적용돼 셋이 딱 붙는다. */
  #pv-postactions { display:inline-flex; align-items:center; gap:var(--s2); flex-wrap:wrap; justify-content:flex-end; }
  /* 켜고 끄는 버튼은 글자를 바꾸지 않는다 — 켜짐을 색으로 보인다. 글자가 바뀌면 원래 버튼이
     사라진 것처럼 읽힌다(2026-09-16 "상단 고정이 사라졌다" 보고). */
  .btn.on { background:var(--accent-soft); border-color:var(--on-accent); color:var(--on-accent); font-weight:700; }

  /* ── 댓글 — 글 보기와 같은 밴드 문법(좌우 테두리 없음), 같은 좌측 기준선 ── */
  .cmts { margin-top:var(--s6); border-top:1px solid var(--line); border-bottom:1px solid var(--line); max-width:var(--read); margin-inline:auto; }
  .cmts .h { padding:var(--s3) var(--s4); border-bottom:1px solid var(--line-soft); font-weight:700; font-size:13px; }
  .cmts .h b { color:var(--brand); }
  .cmts ul { list-style:none; margin:0; padding:0; }
  /* 작성자 칸은 고정 92px 이 아니라 내용 기준 — 6자리 익명 코드 + 글쓴이 배지가 잘리던 자리. */
  .cmts li { display:grid; grid-template-columns:max-content 1fr auto; gap:var(--s1) var(--s3); padding:var(--s3) var(--s4); border-bottom:1px solid var(--line-soft); align-items:baseline; }
  .cmts li:last-child { border-bottom:none; }
  .cmts .who { display:flex; align-items:baseline; gap:var(--s1); min-width:92px; font-weight:700; font-size:12px; color:var(--ink); white-space:nowrap; }
  .cmts .who.op { color:var(--brand); }
  .cmts .opb, .cmts .who .mine { flex:none; }
  .cmts .opb { padding:0 5px; font-size:10px; font-weight:700; line-height:16px; color:var(--brand); border:1px solid var(--brand); border-radius:4px; }
  .cmts .who.gone { color:var(--sub); font-weight:400; }
  .cmts .txt { font-size:14px; line-height:1.7; overflow-wrap:anywhere; }
  .cmts .txt.tomb { color:var(--sub); font-style:italic; }
  .cmts .when { display:flex; align-items:baseline; gap:var(--s2); font-size:11px; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cmts .when .acts { display:flex; gap:var(--s2); }
  .cmts .when .lnk { font-size:11px; color:var(--sub); }
  .cmts .when .lnk:hover { color:var(--ink); }
  .pv-reasons { display:grid; gap:var(--s2); margin:var(--s3) 0; }
  .pv-reasons .btn { justify-content:flex-start; min-height:44px; font-weight:500; }
  .cmts .lock { padding:var(--s4); text-align:center; color:var(--sub); font-size:13px; border-top:1px solid var(--line-soft); }
  /* 로그인하면 app.js 가 이 슬롯을 폼으로 바꾼다 — 그때는 껍데기 패딩·테두리를 걷어 이중 박스를 막는다. */
  .cmts .cform-slot { padding:0; border-top:1px solid var(--line-soft); }
  /* 댓글이 0개면 헤더 아래 선과 슬롯 위 선이 맞붙어 2px 이중선이 된다 — 하나를 지운다. */
  .cmts .h + #pv-comments:not(:has(li)) + .lock,
  .cmts .h + #pv-comments:not(:has(li)) + .cform-slot { border-top:none; }

  /* ── 하단 앱 배너 + 푸터 ── */
  /* 배너는 면이 아니라 선으로 — 다크에서 면끼리 대비가 없어 박스도 버튼도 사라지던 자리. */
  .promo { margin-top:var(--s8); padding:var(--s4) 0 0; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:var(--s3); flex-wrap:wrap; }
  .promo b { color:var(--brand); font-size:14px; font-weight:700; }
  .promo p { margin:2px 0 0; color:var(--sub); font-size:12px; }
  .promo .stores { display:flex; gap:var(--s2); }
  footer { margin-top:var(--s8); padding:var(--s4) 0 var(--s8); border-top:1px solid var(--line); color:var(--sub); font-size:12px; }
  footer .wrap { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  footer a { color:var(--sub); }

  /* ── 상호작용 레이어(app.js) ── */
  .top .acct { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:12px; }
  .top .acct + .cta { margin-left:0; }
  .top .acct .me { opacity:.85; }
  .lnk { background:none; border:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .top .lnk { color:#fff; opacity:.9; text-decoration:none; font-weight:700; }
  dialog.pv { border:1px solid var(--line-strong); border-radius:10px; padding:20px 20px 18px; width:min(420px, calc(100vw - 32px)); background:var(--surface); color:var(--ink); }
  dialog.pv::backdrop { background:rgba(0,0,0,.45); }
  dialog.pv h3 { margin:0 0 6px; font-size:16px; }
  dialog.pv .x { position:absolute; top:8px; right:10px; background:none; border:none; font-size:20px; color:var(--sub); cursor:pointer; }
  .pv-tabs { display:flex; gap:2px; margin-bottom:12px; border-bottom:1px solid var(--line); }
  .pv-tabs button { flex:1; background:none; border:none; border-bottom:2px solid transparent; padding:8px; font:inherit; font-weight:700; color:var(--sub); cursor:pointer; }
  .pv-tabs button.on { color:var(--brand); border-bottom-color:var(--brand); }
  /* 사진 미리보기 — 확인해야 올라간다(고르자마자 올리면 잘못 고른 사진이 서버에 남는다) */
  .ned-photos .pv-photos { display:grid; grid-template-columns:repeat(auto-fill, minmax(116px, 1fr)); gap:8px; margin:var(--s3) 0 var(--s2); max-height:46vh; overflow:auto; }
  .ned-photos .pv-photos figure { margin:0; }
  .ned-photos .pv-photos img { display:block; width:100%; height:104px; object-fit:cover; border-radius:6px; background:var(--head); }
  .ned-photos .pv-photos figcaption { margin-top:4px; font-size:11px; color:var(--sub); font-variant-numeric:tabular-nums; text-align:center; }

  .pv-social { display:grid; gap:8px; }
  /* 소셜 버튼은 각 제공자의 브랜드 색을 쓴다 — 이용자가 색만 보고 고르는 버튼이라
     테마에 따라 뒤집지 않는다(다크에서도 카카오는 노랑, 애플은 검정). */
  .pv-social button { position:relative; padding:11px 14px 11px 44px; justify-content:center; border-radius:8px; font-size:14px; }
  .pv-social button svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; }
  .pv-social button[data-oauth="google"] { background:#FFFFFF; color:#1F1F1F; border:1px solid #DADCE0; }
  .pv-social button[data-oauth="kakao"]  { background:#FEE500; color:#191600; border:1px solid #FEE500; }
  .pv-social button[data-oauth="apple"]  { background:#000000; color:#FFFFFF; border:1px solid #000000; }
  .pv-social button:hover { filter:brightness(.96); }
  .pv-or { text-align:center; color:var(--sub); font-size:11px; margin:10px 0 6px; }
  .pv-form { display:grid; gap:10px; }
  .pv-form label { display:grid; gap:4px; font-size:12px; color:var(--sub); font-weight:700; }
  .pv-form input[type=text], .pv-form input[type=email], .pv-form input[type=password], .pv-form textarea { font:inherit; font-size:16px; padding:10px 12px; min-height:44px; border:1px solid var(--line-strong); border-radius:6px; background:var(--bg); color:var(--ink); }
  body:has(dialog.pv[open]) { overflow:hidden; }
  dialog.pv { max-height:calc(100dvh - 32px); overflow:auto; }
  .pv-form textarea { resize:vertical; line-height:1.6; }
  .pv-form .btn { font-size:14px; min-height:44px; }
  .pv-social button { min-height:44px; }
  .pv-tabs button { min-height:44px; }
  .pv-form .btn:disabled { opacity:.6; cursor:default; }
  .pv-radio { border:none; padding:0; margin:0; display:flex; gap:14px; font-size:13px; color:var(--ink); }
  .pv-radio legend { font-size:12px; color:var(--sub); font-weight:700; margin-bottom:4px; }
  .pv-radio label { display:flex; align-items:center; gap:4px; font-weight:500; color:var(--ink); }
  .pv-check { display:flex !important; align-items:center; gap:6px; font-weight:500 !important; color:var(--ink) !important; }
  .pv-check a { color:var(--brand); text-decoration:underline; }
  .pv-err { margin:0; color:var(--danger); font-size:12px; }

  /* ── 글쓰기 페이지(write.html) — 네이버 스마트에디터 참고: 헤더(게시) + 2줄 도구 막대 + 넓은 문서 ── */

  .ned-row .ico svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; color:var(--ink); }
  .ned-row select { border:1px solid var(--line-soft); padding:0 8px; min-width:92px; -webkit-appearance:none; appearance:none; background:var(--surface); }
  .ned-row .b { font-weight:800; } .ned-row .i { font-style:italic; } .ned-row .u { text-decoration:underline; }

  .ned-pal { position:absolute; top:40px; left:0; z-index:5; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px; display:grid; grid-template-columns:repeat(8, 24px); gap:6px; box-shadow:0 8px 24px rgba(0,0,0,.14); }

  .ned-doc { max-width:calc(var(--read) + 40px); margin:0 auto; padding:var(--s6) 20px 60px; }
  .ned-doc #ed-title { width:100%; border:none; background:transparent; color:var(--ink); font:inherit; font-size:28px; font-weight:700; line-height:1.3; padding:6px 0 14px; border-bottom:1px solid var(--line-soft); margin-bottom:18px; outline:none; letter-spacing:-0.4px; }
