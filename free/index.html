<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181A1C" media="(prefers-color-scheme: dark)" />
    <title>피클허브 커뮤니티 — 자유게시판</title>
    <meta name="description" content="피클볼 이야기를 익명으로 나누는 곳입니다. 로그인하면 웹에서도 바로 쓸 수 있습니다." />
    <link rel="canonical" href="https://picklehubkorea.com/free/" />
    <link rel="icon" href="https://picklehubkorea.com/assets/logo-128.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="피클허브 커뮤니티" />
    <meta property="og:title" content="피클허브 커뮤니티 — 자유게시판" />
    <meta property="og:description" content="피클볼 이야기를 익명으로 나누는 곳입니다. 로그인하면 웹에서도 바로 쓸 수 있습니다." />
    <meta property="og:url" content="https://picklehubkorea.com/free/" />
    <meta property="og:image" content="https://picklehubkorea.com/assets/logo-256.png" />
    
    
    <style>
  :root {
    /* --brand·--accent 는 앱 토큰과 같은 값(머리 주석 참고). 나머지는 웹 전용 중립·틴트다. */
    --brand:#00361A; --brand-soft:#EDF5EF; --accent:#FBE366; --accent-soft:#FFF8DF; --on-accent:#796017;
    --bg:#FFFFFF; --surface:#FFFFFF; --ink:#232629; --sub:#646A70; --line:#DDE0E3; --line-soft:#ECEEF0;
    --row-hover:#F8F9FA; --head:#F6F7F8;
    /* 컨트롤 테두리는 표 헤어라인과 용도가 다르다 — 3:1 을 넘겨야 입력창·2차 버튼의 경계가 보인다. */
    --line-strong:#8B968D; --on-brand:#FFFFFF; --danger:#B4372E;
    /* 4px 간격 스케일. 밀도는 표 '안'에서 지키고 여백은 표 '바깥'에서 낸다. */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
    /* 읽기 열 — 본문·댓글·편집기가 공유한다(한글 약 42자). */
    --read:720px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* 세이지 #5E9278 은 오너가 앱에서 세 번 낮춰 확정한 값이다. 이 녹색 글자가 AA(4.5:1)를
         넘도록 짝을 맞췄다 — brand-soft 는 앱과 같은 #0F2416(4.56:1), 행 hover 는 #1E2125(4.5:1).
         바탕 #181A1C 위에서는 4.87:1. 공지·새 글 행(accent-soft)의 댓글 수는 on-accent 로 쓴다. */
      --brand:#5E9278; --brand-soft:#0F2416; --accent:#BCA45C; --accent-soft:#302D20; --on-accent:#F1E4B3;
      --bg:#181A1C; --surface:#181A1C; --ink:#ECEEF0; --sub:#ABB0B6; --line:#393D42; --line-soft:#2D3136;
      --row-hover:#1E2125; --head:#21252A;
      --line-strong:#718276; --on-brand:#121513; --danger:#FF8278;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; } /* display:flex/grid 를 준 요소도 hidden 속성이 이기게 */
  html { -webkit-text-size-adjust:100%; color-scheme:light; }
  @media (prefers-color-scheme: dark) { html { color-scheme:dark; } }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
         letter-spacing:0;
         font-variant-numeric:tabular-nums;
         /* 빈 게시판에서 푸터가 화면 중간에 뜨지 않게 */
         min-height:100dvh; display:flex; flex-direction:column; }
  .community-main { min-width:0; padding:30px 0 48px; }
  a { color:inherit; text-decoration:none; }
  a:hover { text-decoration:underline; }
  :where(a,button,input,select,textarea,summary,[contenteditable]):focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
  :where(button,a,summary) { touch-action:manipulation; }
  .skip-link { position:fixed; left:16px; top:-80px; z-index:100; background:var(--surface); color:var(--ink); padding:12px; }
  .skip-link:focus { top:8px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  .wrap { width:100%; max-width:1240px; margin:0 auto; padding:0 var(--s4); }
  @media (min-width:1080px) { .wrap { padding:0 var(--s6); } }

  /* ── 브랜드 헤더 ── */
  .top { background:var(--surface); color:var(--ink); border-bottom:1px solid var(--line-soft); position:relative; z-index:10; }
  .top .wrap { min-height:76px; display:flex; align-items:center; gap:16px; position:relative; }
  .top img { width:36px; height:36px; border-radius:8px; display:block; }
  .top .brand { font-weight:800; font-size:24px; letter-spacing:0; white-space:nowrap; }
  .top .brand small { font-weight:500; color:var(--sub); margin-left:14px; font-size:13px; letter-spacing:0; }
  .top .wrap > * { position:relative; z-index:1; }
  .top .cta { margin-left:auto; border:1px solid var(--line); color:var(--ink); font-weight:700; font-size:13px;
              padding:8px 14px; border-radius:6px; white-space:nowrap; min-height:44px; display:inline-flex; gap:8px; align-items:center; }
  .top .cta:hover { text-decoration:none; background:var(--head); border-color:var(--line-strong); }
  @media (max-width:640px) { .top .cta { min-height:44px; } }

  /* One navigation tree: a quiet rail on desktop, board tabs on mobile. */
  .community-layout { flex:1 0 auto; display:grid; grid-template-columns:172px minmax(0,1fr); gap:32px; }
  .community-rail { border-right:1px solid var(--line-soft); padding:32px 20px 32px 0; }
  .rail-label { display:block; margin:0 12px 12px; color:var(--sub); font-size:12px; font-weight:500; }
  .tabs { display:flex; flex-direction:column; gap:4px; }
  .tabs a { display:flex; align-items:center; min-height:44px; padding:10px 12px; font-weight:500; font-size:14px; color:var(--sub); }
  .tabs a.on { color:var(--brand); font-weight:700; }
  .tabs a:hover { text-decoration:underline; text-underline-offset:5px; color:var(--ink); }
  .rail-account { display:flex; align-items:center; min-height:44px; margin-top:20px; padding:10px 12px; font-size:13px; color:var(--sub); }
  .rail-account[aria-current] { color:var(--brand); font-weight:700; }
  .board-heading { margin-bottom:24px; }
  .board-heading h1 { margin:0; font-size:24px; font-weight:700; line-height:1.4; overflow-wrap:anywhere; }

  /* ── 목록 툴바 ── */
  /* 카운트가 숨겨져도(글 0건) 글쓰기 버튼은 오른쪽에 남는다. */
  .toolbar { display:grid; grid-template-columns:auto auto minmax(150px, 1fr) auto; align-items:center; gap:12px; padding:0 0 14px; font-size:12px; color:var(--sub); }
  .toolbar .btn { margin-left:auto; }
  .toolbar b { color:var(--ink); font-weight:500; }
  /* 버튼 4종으로 수렴 — 1차(primary) / 2차(기본) / 파괴적(danger) / 텍스트(lnk) */
  .btn, .pv-social button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:8px 16px; border-radius:6px; font-size:13px; font-weight:700; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer; font-family:inherit; }
  .ui-icon { width:18px; height:18px; flex:none; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .btn.danger { color:var(--danger); border-color:var(--danger); background:var(--surface); }
  .btn:hover, .pv-social button:hover { text-decoration:none; filter:brightness(.97); }

  /* ── 게시판 표 ── */
  table.list { width:100%; table-layout:fixed; border-collapse:collapse; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface); }
  table.list th { background:var(--head); color:var(--sub); font-weight:400; font-size:12px; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.list td { padding:13px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  table.list tr:hover td { background:var(--row-hover); }
  table.list .num, table.list .date, table.list .views { font-variant-numeric:tabular-nums; }
  /* 제목과 메타의 크기·굵기·색을 구분하고 배지는 작성자 칸 안에 둔다. */
  table.list .num { width:56px; text-align:center; color:var(--sub); font-size:12px; }
  table.list .tit { text-align:left; overflow:hidden; }
  table.list .tit a { display:inline-block; max-width:calc(100% - 44px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; font-size:15px; font-weight:500; }
  table.list .tit .cmt { color:var(--brand); font-weight:700; font-size:12px; margin-left:5px; }
  /* 공지·새 글 행은 노랑 틴트 위라 다크의 세이지 글자가 3.85:1 로 떨어진다 — 그 행의 금색을 쓴다. */
  table.list tr.notice .tit .cmt, table.list tr.fresh .tit .cmt { color:var(--on-accent); }
  table.list .who { width:112px; text-align:center; color:var(--sub); font-size:12px; font-weight:400; white-space:nowrap; }
  table.list .who .band { display:table; margin:4px auto 0; }
  /* 넓은 화면에서는 배지를 이름 옆 한 줄에 둔다 — 배지 있는 행만 두 줄이 되면 표 행 높이가
     들쭉날쭉해진다. 칸을 넓히고 왼쪽 정렬해 이름 시작점도 행마다 같게 둔다. 좁은 화면(태블릿)은
     제목 칸을 지키려고 두 줄 그대로다. 맥 글꼴 기준 내용 폭 157px — 글꼴이 더 넓으면 옆 칸을
     침범하지 않고 배지만 다음 줄로 내려가게 줄바꿈을 연다. */
  @media (min-width:1080px) {
    table.list th.who, table.list td.who { width:192px; text-align:left; padding-left:16px; white-space:normal; }
    table.list .who .band { display:inline-block; margin:0 0 0 6px; }
  }
  table.list .date { width:76px; text-align:center; color:var(--sub); font-size:12px; font-weight:400; white-space:nowrap; }
  table.list .views { width:52px; text-align:center; color:var(--sub); font-size:12px; font-weight:400; white-space:nowrap; }
  table.list tr.notice td { background:var(--accent-soft); }
  table.list tr.notice .num { color:var(--on-accent); font-weight:700; }
  table.list tr.notice .tit a { font-weight:700; }
  table.list tr.empty td { text-align:center; padding:48px 16px; color:var(--sub); line-height:1.7; }
  table.list tr.empty strong { display:block; font-size:16px; font-weight:700; color:var(--ink); margin-bottom:var(--s2); }
  table.list tr.empty .btn { margin-top:var(--s4); }

  /* ── 페이지 번호 ── */
  .paging { display:flex; flex-wrap:wrap; justify-content:center; gap:var(--s1); padding:var(--s6) 0 var(--s2); font-size:12px; }
  .paging a, .paging span { min-width:36px; height:36px; line-height:34px; text-align:center; padding:0 var(--s2); border:1px solid var(--line-soft); border-radius:6px; color:var(--sub); background:var(--surface); }
  .paging .cur { border-color:var(--brand); color:var(--brand); font-weight:700; }
  @media (max-width:640px) { .paging a, .paging span { min-width:44px; height:44px; line-height:42px; } }
  .paging a:hover { text-decoration:none; border-color:var(--line); color:var(--ink); }

  /* ── 글 보기 — 읽기 열(--read)로 좁힌 밴드. 표는 1040px 를 그대로 쓰므로 게시판 밀도는 그대로다. ──
     읽기 열은 가운데가 아니라 왼쪽에 붙인다 — 게시판 제목(h1)이 본문 영역 왼쪽에 있어서, 가운데에
     두면 제목과 본문의 시작선이 134px 어긋난다(2026-09-23). 본문·링크·목록 버튼·댓글은 모두
     좌우 여백 0 으로 같은 선에서 시작한다(개편 때 제목·본문만 0 이 되어 16px 어긋났었다). */
  .view { border-bottom:1px solid var(--line); max-width:var(--read); margin:0; }
  .view .head { padding:12px 0 24px; border-bottom:1px solid var(--line-soft); }
  .view .head .badge { display:inline-block; font-size:11px; font-weight:700; color:var(--on-accent); background:var(--accent-soft); padding:2px 7px; border-radius:4px; margin-right:6px; vertical-align:2px; }
  .view h2 { margin:0 0 var(--s2); font-size:28px; font-weight:700; line-height:1.5; letter-spacing:0; text-wrap:balance; overflow-wrap:anywhere; }
  .view .meta { display:flex; flex-wrap:wrap; gap:var(--s1) var(--s3); color:var(--sub); font-size:12px; }
  .view .meta b { color:var(--ink); font-weight:500; }
  .view .body { padding:32px 0 40px; font-size:17px; line-height:1.9; overflow-wrap:anywhere; }
  .view .body p { margin:0 0 var(--s4); }
  .view .link { padding:0 0 var(--s4); font-size:13px; }
  .view .link a { color:var(--brand); font-weight:700; overflow-wrap:anywhere; }
  .view .foot { display:flex; justify-content:space-between; align-items:center; gap:var(--s3); padding:var(--s3) 0; border-top:1px solid var(--line-soft); }
  .view .foot:empty { display:none; }
  /* 글 작업 버튼(수정·삭제·상단 고정)은 한 span 안에 들어간다 — 그 안에도 같은 간격을 준다.
     안 그러면 바깥 gap 만 적용돼 셋이 딱 붙는다. */
  #pv-postactions { display:inline-flex; align-items:center; gap:var(--s2); flex-wrap:wrap; justify-content:flex-end; }
  /* 켜고 끄는 버튼은 글자를 바꾸지 않는다 — 켜짐을 색으로 보인다. 글자가 바뀌면 원래 버튼이
     사라진 것처럼 읽힌다(2026-09-16 "상단 고정이 사라졌다" 보고). */
  .btn.on { background:var(--accent-soft); border-color:var(--on-accent); color:var(--on-accent); font-weight:700; }

  /* ── 댓글 — 글 보기와 같은 밴드 문법(좌우 테두리 없음), 같은 좌측 기준선 ── */
  .cmts { margin-top:var(--s6); border-top:1px solid var(--line); border-bottom:1px solid var(--line); max-width:var(--read); }
  .cmts .h { padding:var(--s3) 0; border-bottom:1px solid var(--line-soft); font-weight:700; font-size:13px; }
  .cmts .h b { color:var(--brand); }
  .cmts ul { list-style:none; margin:0; padding:0; }
  /* 작성자 칸은 고정 92px 이 아니라 내용 기준 — 6자리 익명 코드 + 글쓴이 배지가 잘리던 자리. */
  .cmts li { display:grid; grid-template-columns:max-content 1fr auto; gap:var(--s1) var(--s3); padding:var(--s3) 0; border-bottom:1px solid var(--line-soft); align-items:baseline; }
  .cmts li:last-child { border-bottom:none; }
  .cmts .who { display:flex; align-items:baseline; gap:var(--s1); min-width:92px; font-weight:700; font-size:12px; color:var(--ink); white-space:nowrap; }
  .cmts .who.op { color:var(--brand); }
  .cmts .opb, .cmts .who .mine { flex:none; }
  .cmts .opb { padding:0 5px; font-size:10px; font-weight:700; line-height:16px; color:var(--brand); border:1px solid var(--brand); border-radius:4px; }
  .cmts .who.gone { color:var(--sub); font-weight:400; }
  .cmts .txt { font-size:14px; line-height:1.7; overflow-wrap:anywhere; }
  .cmts .txt.tomb { color:var(--sub); font-style:italic; }
  /* 날짜는 늘 둘째 줄. 반응 버튼이 있는 댓글은 첫 줄 세 칸이 차서 날짜가 둘째 줄로 내려가고,
     숨김 댓글(반응 없음)은 첫 줄 오른쪽 끝에 붙어 자리가 갈렸다. */
  .cmts .when { grid-column:1 / -1; display:flex; align-items:baseline; gap:var(--s2); font-size:11px; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cmts .when .acts { display:flex; gap:var(--s2); }
  .cmts .when .lnk { font-size:11px; color:var(--sub); }
  .cmts .when .lnk:hover { color:var(--ink); }
  .pv-reasons { display:grid; gap:var(--s2); margin:var(--s3) 0; }
  .pv-reasons .btn { justify-content:flex-start; min-height:44px; font-weight:500; }
  .cmts .lock { padding:var(--s4) 0; text-align:center; color:var(--sub); font-size:13px; border-top:1px solid var(--line-soft); }
  #pv-comment-paging { text-align:center; padding:var(--s3); font-size:13px; color:var(--sub); }
  #pv-comment-paging:empty { display:none; }
  /* 로그인하면 app.js 가 이 슬롯을 폼으로 바꾼다 — 그때는 껍데기 패딩·테두리를 걷어 이중 박스를 막는다. */
  .cmts .cform-slot { padding:0; border-top:1px solid var(--line-soft); }
  /* 댓글이 0개면 헤더 아래 선과 슬롯 위 선이 맞붙어 2px 이중선이 된다 — 하나를 지운다. */
  .cmts .h + #pv-comments:not(:has(li)) + .lock,
  .cmts .h + #pv-comments:not(:has(li)) + .cform-slot { border-top:none; }

  /* ── 하단 앱 배너 + 푸터 ── */
  /* 배너는 면이 아니라 선으로 — 다크에서 면끼리 대비가 없어 박스도 버튼도 사라지던 자리. */
  .promo { margin-top:32px; padding:24px 12px 0; border-top:1px solid var(--line-soft); }
  .promo b { color:var(--ink); font-size:12px; font-weight:700; }
  .promo .stores { display:flex; flex-direction:column; gap:0; margin-top:8px; }
  .promo .stores a { display:inline-flex; align-items:center; gap:8px; min-height:44px; font-size:12px; color:var(--sub); }
  .promo .ui-icon { width:14px; height:14px; }
  .footer-stores { margin-left:auto; display:flex; gap:16px; }
  footer { padding:20px 0; border-top:1px solid var(--line-soft); color:var(--sub); font-size:12px; }
  footer .wrap { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
  footer a { color:var(--sub); display:inline-flex; align-items:center; min-height:44px; }

  /* ── 상호작용 레이어(app.js) ── */
  .top .acct { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:12px; }
  .top .acct + .cta { margin-left:0; }
  .account-desktop { display:flex; align-items:center; gap:14px; }
  .account-name { max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.85; }
  .account-mobile { display:none; position:relative; }
  /* 브라우저 기본 삼각형(▶) 대신 꺾쇠 하나 — 열리면 뒤집힌다. 사파리는 ::-webkit-details-marker 로만 숨는다. */
  .account-mobile summary { list-style:none; display:flex; align-items:center; gap:6px; cursor:pointer; min-height:44px; padding:10px 8px; font-size:13px; font-weight:500; color:var(--ink); }
  .account-mobile summary::-webkit-details-marker { display:none; }
  .account-mobile summary::after { content:""; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:translateY(-2px) rotate(45deg); }
  .account-mobile[open] summary::after { transform:translateY(2px) rotate(-135deg); }
  .account-actions { position:absolute; right:0; top:48px; width:200px; display:grid; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); box-shadow:0 8px 24px #0002; }

  .pv-or { text-align:center; color:var(--sub); font-size:11px; margin:10px 0 6px; }

  /* 글 좋아요 — 패들. 본문과 목록 버튼 사이에 홀로 둔다(가장 큰 반응 지점).
     클래스 이름이 표의 '좋아요' 열(.likes)과 겹치면 안 된다 — 범위 없는 display:flex
     가 <th>/<td> 에도 먹어 셀이 테이블 셀이 아니게 되고, table-layout:fixed 가 열

             border:1px solid var(--line-strong); border-radius:999px; background:var(--surface); color:var(--sub);

  .pv-form select { font:inherit; font-size:16px; padding:10px 12px; min-height:44px; border:1px solid var(--line-strong);
                    border-radius:6px; background:var(--bg); color:var(--ink); }

  /* DUPR 연동 팝업 — 창을 꽉 채운다(모달과 달리 여백을 낭비할 이유가 없다). */
  body.dc { min-height:100dvh; }

  .dc-wrap h1 { margin:0; font-size:16px; font-weight:700; }

  .dc-msg { margin:var(--s2) 0 0; font-size:13px; color:var(--sub); }

  .me-link small { flex:1 0 100%; color:var(--sub); font-size:11px; line-height:1.55; word-break:keep-all; }
  /* 내 정보의 켜고 끄기 한 줄 — 터치 표적을 라벨 전체로 넓힌다(체크박스만 누르게 두면 모바일에서 놓친다). */
  /* 게시판 검색 — 도구줄 가운데. 좁아지면 한 줄을 통째로 차지한다. */
  .toolbar .search { display:flex; gap:var(--s2); min-width:0; width:100%; max-width:260px; justify-self:end; grid-column:3; margin:0; }
  .toolbar > .btn { grid-column:4; min-height:44px; white-space:nowrap; padding:8px 4px;
                    background:transparent; border:0; border-radius:0; color:var(--brand); }

  .list-total { white-space:nowrap; grid-column:2; }
  /* 입력 글자 16px 은 멋이 아니라 규격이다 — 그보다 작으면 iOS 가 탭할 때 화면을
     자동 확대한다. 터치 표적 44px 과 함께 docs/hub-community-web.md 의 규약이다.
     모바일 블록의 .btn{min-height:44px} 는 특정도가 낮아 여기서 직접 적어야 이긴다. */
  .toolbar .search { position:relative; }
  .toolbar .search input { flex:1 1 auto; min-width:0; min-height:44px; padding:8px 48px 8px 0; font:inherit; font-size:16px;
                           color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--line-strong); border-radius:0; appearance:none; }
  .toolbar .search input::placeholder { color:var(--sub); }

  .toolbar .search:focus-within input { border-color:var(--brand); }
  .search-note { margin:0 0 var(--s2); font-size:13px; color:var(--sub); }

  .rich .b { font-weight:700; } .rich .i { font-style:italic; } .rich .u { text-decoration:underline; }

  /* ── 글쓰기 페이지(write.html) — 네이버 스마트에디터 참고: 헤더(게시) + 2줄 도구 막대 + 넓은 문서 ── */
  .ned { background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-top:0; }

  .ned-doc { max-width:calc(var(--read) + 40px); margin:0 auto; padding:32px 20px 64px; }
